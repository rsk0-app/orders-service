name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  packages: write

jobs:
  build-test:
    runs-on: arc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  image:
    # Build + push the container only for main (post-merge), never for PRs.
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: arc
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/rsk0-app/orders-service:latest
            ghcr.io/rsk0-app/orders-service:canary
            ghcr.io/rsk0-app/orders-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Record candidate build evidence
        env:
          RSK0_IMAGE_REPOSITORY: ghcr.io/rsk0-app/orders-service
          RSK0_IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: node scripts/emit-candidate-build.mjs
      - name: Upload candidate build evidence
        uses: actions/upload-artifact@v4
        with:
          name: rsk0-candidate-build-${{ github.run_attempt }}
          path: candidate-build.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7

      - name: Pin chart image.tag to this commit
        # GitOps (ArgoCD) deploys .Values.image.tag. Bump it to the immutable
        # :${sha} we just built+pushed so the cluster gets THIS commit's image,
        # never a stale mutable :canary. Commit carries [skip ci] so this push
        # does not retrigger the workflow (no loop). Race-safe against the
        # stand generator: re-sync onto latest main and re-apply the bump.
        env:
          SHA: ${{ github.sha }}
        run: |
          set -u
          git config user.name "rsk0-ci"
          git config user.email "ci@rsk0.app"

          bump_tag() {
            if command -v yq >/dev/null 2>&1; then
              SHA="$SHA" yq -i '.image.tag = strenv(SHA)' chart/values.yaml
            else
              # Scoped rewrite: only the `tag:` line INSIDE the top-level
              # `image:` block (inimg resets on any other column-0 key).
              awk -v sha="$SHA" '
                /^[^[:space:]#]/ { inimg = ($0 ~ /^image:/) }
                inimg && /^[[:space:]]+tag:[[:space:]]/ { sub(/tag:[[:space:]].*/, "tag: " sha) }
                { print }
              ' chart/values.yaml > chart/values.yaml.tmp && mv chart/values.yaml.tmp chart/values.yaml
            fi
          }

          for attempt in 1 2 3; do
            git fetch origin main || true
            git reset --hard origin/main
            bump_tag
            if git diff --quiet -- chart/values.yaml; then
              echo "image.tag already $SHA — nothing to bump"
              exit 0
            fi
            git add chart/values.yaml
            git commit -m "ci: pin chart image.tag to $SHA [skip ci]"
            if git push origin HEAD:main; then
              echo "Pushed image.tag bump -> $SHA"
              exit 0
            fi
            echo "push rejected (attempt $attempt/3) — re-syncing and retrying"
            sleep $((attempt * 2))
          done
          echo "WARN: could not push image.tag bump after 3 attempts; leaving main as-is"
          exit 0
