name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build-test:
    runs-on: arc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  image:
    # Build + push the container only for main (post-merge), never for PRs.
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: arc
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/rsk0-app/orders-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Record candidate build evidence
        env:
          RSK0_IMAGE_REPOSITORY: ghcr.io/rsk0-app/orders-service
          RSK0_IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: node scripts/emit-candidate-build.mjs
      - name: Upload candidate build evidence
        uses: actions/upload-artifact@v4
        with:
          name: rsk0-candidate-build-${{ github.run_attempt }}
          path: candidate-build.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7

      - name: Install Helm
        uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - name: Render and validate candidate
        env:
          RSK0_NEGATIVE_PILOT_SHA: ${{ vars.RSK0_NEGATIVE_PILOT_SHA }}
          RSK0_REPLACEMENT_PILOT_SHA: ${{ vars.RSK0_REPLACEMENT_PILOT_SHA }}
          RSK0_IMAGE_REPOSITORY: ghcr.io/rsk0-app/orders-service
          RSK0_IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          node scripts/verify-producer.mjs
          node scripts/prepare-request.mjs .rsk0/target.json
          namespace=$(node -p 'JSON.parse(require("fs").readFileSync(".rsk0/target.json")).namespace')
          if [ -n "$RSK0_NEGATIVE_PILOT_SHA" ] && ! [[ "$RSK0_NEGATIVE_PILOT_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "invalid negative pilot SHA" >&2; exit 1
          fi
          if [ -n "$RSK0_REPLACEMENT_PILOT_SHA" ] && ! [[ "$RSK0_REPLACEMENT_PILOT_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "invalid replacement pilot SHA" >&2; exit 1
          fi
          RSK0_CANDIDATE_PROFILE=
          if [ -n "$RSK0_NEGATIVE_PILOT_SHA" ] && [ "$RSK0_NEGATIVE_PILOT_SHA" = "$GITHUB_SHA" ]; then
            RSK0_CANDIDATE_PROFILE=negative-readiness
          fi
          if [ -n "$RSK0_REPLACEMENT_PILOT_SHA" ] && [ "$RSK0_REPLACEMENT_PILOT_SHA" = "$GITHUB_SHA" ]; then
            if [ -n "$RSK0_CANDIDATE_PROFILE" ]; then
              echo "conflicting pilot profiles" >&2; exit 1
            fi
            RSK0_CANDIDATE_PROFILE=replacement-readiness
          fi
          case "$RSK0_CANDIDATE_PROFILE" in
            "") release=orders-service; set -- ;;
            negative-readiness)
              release=orders-mvp-negative
              set -- --set appLabel=orders-mvp-negative --set replicaCount=1 \
                --set readinessPath=/rsk0-intentional-readiness-failure --set progressDeadlineSeconds=60 \
                --set-string env.MEM_FOOTPRINT_MB=16 --set resources.requests.cpu=25m \
                --set resources.requests.memory=64Mi --set resources.limits.cpu=100m --set resources.limits.memory=128Mi
              ;;
            replacement-readiness)
              release=orders-mvp-negative
              set -- --set appLabel=orders-mvp-negative --set replicaCount=1 \
                --set readinessPath=/readyz --set progressDeadlineSeconds=60 \
                --set-string env.MEM_FOOTPRINT_MB=16 --set resources.requests.cpu=25m \
                --set resources.requests.memory=64Mi --set resources.limits.cpu=100m --set resources.limits.memory=128Mi
              ;;
            *) echo "unsupported candidate profile" >&2; exit 1 ;;
          esac
          helm template "$release" chart --namespace "$namespace" -f candidate-values.json "$@" > candidate-rendered.yaml
          node scripts/emit-candidate-config.cjs candidate-request.json candidate-rendered.yaml
      - name: Upload candidate configuration
        uses: actions/upload-artifact@v4
        with:
          name: rsk0-candidate-config-${{ github.run_attempt }}
          path: candidate-config.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7
