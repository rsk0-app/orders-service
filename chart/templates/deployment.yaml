apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-orders-service
  labels:
    app: orders-service
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: orders-service
  template:
    metadata:
      labels:
        app: orders-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.service.targetPort }}"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: orders-service
          image: "{{ .Values.image.repository }}@{{ required "image.digest is required" .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-orders-config
                  key: ENVIRONMENT
            - name: MEM_FOOTPRINT_MB
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-orders-config
                  key: MEM_FOOTPRINT_MB
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "database.secretName is required" .Values.database.secretName | quote }}
                  key: DATABASE_URL
            - name: FAILURE_MODE
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-orders-config
                  key: FAILURE_MODE
            - name: ERROR_RATE
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-orders-config
                  key: ERROR_RATE
            - name: LATENCY_MS
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-orders-config
                  key: LATENCY_MS
            - name: DOWNSTREAM_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-orders-config
                  key: DOWNSTREAM_URL
            # R5 fan-out: second downstream — inventory-service (leaf).
            - name: INVENTORY_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-orders-config
                  key: INVENTORY_URL
            - name: DEP_TIMEOUT_MS
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-orders-config
                  key: DEP_TIMEOUT_MS
          # Liveness stays SHALLOW (/healthz): a downstream outage must not get
          # the pod killed. Readiness is DEEP (/readyz): it deep-checks the
          # downstream so an outage flips the pod NotReady -> ArgoCD Degraded.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
{{ toYaml .Values.resources | indent 12 }}
