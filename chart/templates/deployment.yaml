apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-orders-service
  labels:
    app: orders-service
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: orders-service
  template:
    metadata:
      labels:
        app: orders-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.service.targetPort }}"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: orders-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: ENVIRONMENT
              value: {{ .Values.env.ENVIRONMENT | quote }}
            - name: DATABASE_URL
              value: {{ .Values.database.url | quote }}
            - name: FAILURE_MODE
              value: {{ .Values.failure.mode | quote }}
            - name: ERROR_RATE
              value: {{ .Values.failure.errorRate | quote }}
            - name: LATENCY_MS
              value: {{ .Values.failure.latencyMs | quote }}
            - name: DOWNSTREAM_URL
              value: {{ .Values.downstream.url | quote }}
            - name: DEP_TIMEOUT_MS
              value: {{ .Values.downstream.timeoutMs | quote }}
          # Liveness stays SHALLOW (/healthz): a downstream outage must not get
          # the pod killed. Readiness is DEEP (/readyz): it deep-checks the
          # downstream so an outage flips the pod NotReady -> ArgoCD Degraded.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
{{ toYaml .Values.resources | indent 12 }}
