replicaCount: 1
image:
  repository: ghcr.io/rsk0-app/orders-service
  tag: canary
  pullPolicy: Always
service:
  port: 80
  targetPort: 8080
resources:
  limits: {}
  requests:
    cpu: 50m
    memory: 64Mi
env:
  ENVIRONMENT: production
  ORDERS_BATCH_SIZE: "1000"
# R1: real downstream dependency (orders-service -> payments-api). A downstream
# failure makes business requests 502 and flips readiness -> real blast-radius.
downstream:
  url: "http://payments-api-payments-api.rsk0-apps.svc.cluster.local"
  timeoutMs: 800
failure:
  mode: ""
  errorRate: "0"
  latencyMs: "0"
