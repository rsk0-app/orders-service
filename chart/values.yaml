replicaCount: 1
image:
  repository: ghcr.io/rsk0-app/orders-service
  tag: canary
  pullPolicy: Always
service:
  port: 80
  targetPort: 8080
resources:
  limits: {}
  requests:
    cpu: 50m
    memory: 64Mi
env:
  ENVIRONMENT: production
  ORDERS_BATCH_SIZE: "1000"
failure:
  mode: ""
  errorRate: "0"
  latencyMs: "0"
