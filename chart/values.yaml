replicaCount: 2
image:
  repository: ghcr.io/rsk0-app/orders-service
  tag: 3776e998ee3ece6273e83be4db7f794f76d8b96d
  pullPolicy: Always
service:
  port: 80
  targetPort: 8080
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    # R3 baseline: 256Mi sits comfortably above the ~150Mi footprint + ~runtime,
    # so the pod is healthy at baseline but OOMKilled if a risky change lowers
    # this below the footprint (set_low_memory_limit -> 128Mi).
    memory: 256Mi
env:
  ENVIRONMENT: production
  ORDERS_BATCH_SIZE: "1000"
  # R3: real load-driven memory footprint (MiB); RSS plateaus at ~this value.
  MEM_FOOTPRINT_MB: "150"
database:
  url: postgres://stand:standpass@postgres.rsk0-apps.svc.cluster.local:5432/stand
downstream:
  url: http://payments-api-payments-api.rsk0-apps.svc.cluster.local
  timeoutMs: 800
# R5 fan-out: orders also depends on inventory-service (leaf). /readyz + the
# business path now gate on payments AND inventory (both /readyz) AND the DB.
inventory:
  url: http://inventory-service-inventory-service.rsk0-apps.svc.cluster.local
failure:
  mode: ""
  errorRate: "0"
  latencyMs: "0"
